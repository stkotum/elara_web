<title>Rigid-Flexible Arm</title>
<style>
  /* Layout: full-bleed WebGL canvas behind a floating glass control deck (top-left on desktop,
     a collapsible bottom sheet on phones) plus a slim telemetry readout (top-right). */
  :root {
    --bg: #0b0d12;
    --panel: rgba(18, 21, 28, 0.82);
    --panel-border: rgba(255, 255, 255, 0.09);
    --fg: #e8eaf0;
    --fg-dim: #8b93a7;
    --accent: #5ee6c8;
    --accent-dim: #2f6358;
    --track: rgba(255, 255, 255, 0.12);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1f6;
      --panel: rgba(255, 255, 255, 0.86);
      --panel-border: rgba(20, 24, 32, 0.08);
      --fg: #161a22;
      --fg-dim: #5b6373;
      --accent: #0f8f74;
      --accent-dim: #bfe9de;
      --track: rgba(20, 24, 32, 0.12);
    }
  }
  :root[data-theme="light"] {
    --bg: #eef1f6;
    --panel: rgba(255, 255, 255, 0.86);
    --panel-border: rgba(20, 24, 32, 0.08);
    --fg: #161a22;
    --fg-dim: #5b6373;
    --accent: #0f8f74;
    --accent-dim: #bfe9de;
    --track: rgba(20, 24, 32, 0.12);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  h1, h2, .mono-label { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; }

  #canvas-wrap { position: fixed; inset: 0; touch-action: none; }
  #canvas-wrap canvas { display: block; width: 100%; height: 100%; }

  .deck {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  }

  #panel {
    top: max(16px, env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(340px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .subtitle { font-size: 11.5px; color: var(--fg-dim); margin: 2px 0 0; line-height: 1.4; }

  .group-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-dim);
    margin: 2px 0 -2px;
  }

  .joint-row { display: flex; flex-direction: column; gap: 4px; }
  .joint-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .joint-head .name { color: var(--fg); font-weight: 500; }
  .joint-head .val { color: var(--accent); font-variant-numeric: tabular-nums; }

  .sliders3 { display: grid; grid-template-columns: 1fr; gap: 5px; }
  .slider-line { display: grid; grid-template-columns: 20px 1fr 42px; align-items: center; gap: 8px; }
  .slider-line .tag { font-size: 10px; color: var(--fg-dim); }
  .slider-line .num { font-size: 11px; color: var(--fg-dim); text-align: right; font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--track);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
  }
  input[type="range"]:disabled { opacity: 0.35; }

  .divider { height: 1px; background: var(--panel-border); margin: 2px 0; }

  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button.action {
    flex: 1;
    min-width: 72px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
  }
  button.action.primary { background: var(--accent); color: #06231c; border-color: transparent; }
  button.action:active { transform: scale(0.97); }
  .traj-buttons button.action { font-size: 11.5px; padding: 8px 6px; }

  #hud {
    top: max(16px, env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    padding: 10px 14px;
    font-size: 11px;
    color: var(--fg-dim);
    display: flex;
    gap: 14px;
    font-variant-numeric: tabular-nums;
  }
  #hud b { color: var(--fg); font-weight: 600; }

  #panel-toggle {
    display: none;
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    z-index: 5;
    height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  @media (max-width: 640px) {
    #panel {
      top: auto;
      left: max(10px, env(safe-area-inset-left, 0px));
      right: max(10px, env(safe-area-inset-right, 0px));
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
      width: auto;
      max-height: 56vh;
      transition: transform 0.25s ease;
    }
    #panel.collapsed { transform: translateY(calc(100% + 20px)); }
    #panel-toggle { display: block; }
    #hud { font-size: 10px; padding: 8px 11px; gap: 10px; }
  }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-dim); font-size: 13px; letter-spacing: 0.02em;
    background: var(--bg);
    z-index: 20;
  }
  #loading.hidden { display: none; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">

<div id="canvas-wrap"></div>
<div id="loading">loading physics core...</div>

<div class="deck" id="panel">
  <div>
    <h1>Rigid-Flexible Arm</h1>
    <p class="subtitle">ELARA Lie-group variational integrator, running natively in WASM. PD control on 4 joints, a 6-segment elastic beam end effector.</p>
  </div>

  <div class="divider"></div>
  <div class="group-label">Demo trajectory</div>
  <div class="buttons traj-buttons" id="traj-buttons"></div>

  <div class="divider"></div>
  <div class="group-label">PD target (deg) - gain P - gain D</div>
  <div id="joint-rows" class="sliders3"></div>

  <div class="divider"></div>
  <div class="buttons">
    <button class="action primary" id="btn-play">Pause</button>
    <button class="action" id="btn-reset">Reset</button>
  </div>
</div>

<button id="panel-toggle" aria-label="Toggle controls">Controls</button>

<div class="deck" id="hud">
  <span>t = <b id="hud-t">0.00</b> s</span>
  <span>step = <b id="hud-step">2^-8</b> s</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import init, { Sim } from "./pkg/elara_core.js";

// --- Robot topology (mirrors src/system_data.rs: N_FRAMES=10, PARENT array). ---
// Each limb connects PARENT[i] -> frame i; -1 means "world origin".
const PARENT = [-1, 0, 1, 2, 3, 4, 5, 6, 7, 8];
const LIMB_RADIUS = [0.05, 0.03, 0.03, 0.02, 0.00275, 0.00275, 0.00275, 0.00275, 0.00275, 0.00275];
const JOINT_NAMES = ["Base yaw", "Shoulder", "Elbow", "Instrument roll"];
const BALL_FRAME_PROXIMAL = 3, BALL_RADIUS_PROXIMAL = 0.03;
const BALL_FRAME_DISTAL = 9, BALL_RADIUS_DISTAL = 0.007;

// --- Three.js scene setup. Physics is Z-up; wrap everything in a group tilted to Y-up. ---
const wrap = document.getElementById("canvas-wrap");
const scene = new THREE.Scene();
const isDark = () => !document.documentElement.matches('[data-theme="light"]') &&
  (document.documentElement.getAttribute("data-theme") === "dark" ||
    window.matchMedia("(prefers-color-scheme: dark)").matches);
scene.background = new THREE.Color(isDark() ? 0x0b0d12 : 0xeef1f6);
scene.fog = new THREE.Fog(scene.background.getHex(), 3.5, 9);

const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 50);
camera.position.set(1.7, 1.1, 1.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

const world = new THREE.Group();
world.rotation.x = -Math.PI / 2; // physics +Z (up) -> three.js +Y (up)
scene.add(world);

const grid = new THREE.GridHelper(2.4, 24, 0x5ee6c8, 0x394150);
grid.material.opacity = 0.35;
grid.material.transparent = true;
world.add(grid);

scene.add(new THREE.HemisphereLight(0xaab4c8, 0x14161c, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(1.5, 2.2, 1.2);
scene.add(key);
const rim = new THREE.DirectionalLight(0x5ee6c8, 0.5);
rim.position.set(-1.5, 1.0, -1.0);
scene.add(rim);

const limbMat = new THREE.MeshStandardMaterial({ color: 0x9aa4bd, metalness: 0.35, roughness: 0.4 });
const beamMat = new THREE.MeshStandardMaterial({ color: 0x5ee6c8, metalness: 0.1, roughness: 0.35 });
const jointMat = new THREE.MeshStandardMaterial({ color: 0xe8eaf0, metalness: 0.5, roughness: 0.3 });
const ballMat = new THREE.MeshStandardMaterial({ color: 0xffb454, metalness: 0.6, roughness: 0.25 });

const limbMeshes = PARENT.map((_, i) => {
  const mat = i >= 4 ? beamMat : limbMat;
  const geo = new THREE.CylinderGeometry(LIMB_RADIUS[i], LIMB_RADIUS[i], 1, 16, 1, false);
  const m = new THREE.Mesh(geo, mat);
  world.add(m);
  return m;
});
const jointMeshes = PARENT.map((_, i) => {
  const r = LIMB_RADIUS[i] * 1.3;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), jointMat);
  world.add(m);
  return m;
});
const ballProximal = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS_PROXIMAL, 24, 16), ballMat);
const ballDistal = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS_DISTAL, 20, 14), ballMat);
world.add(ballProximal, ballDistal);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();

const _origin = new THREE.Vector3(0, 0, 0);
const _up = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3();
const _q = new THREE.Quaternion();
const _mid = new THREE.Vector3();

function placeLimb(mesh, pA, pB) {
  _mid.addVectors(pA, pB).multiplyScalar(0.5);
  mesh.position.copy(_mid);
  const len = pA.distanceTo(pB);
  mesh.scale.set(1, Math.max(len, 1e-5), 1);
  _dir.subVectors(pB, pA).normalize();
  if (_dir.lengthSq() > 1e-10) {
    _q.setFromUnitVectors(_up, _dir);
    mesh.quaternion.copy(_q);
  }
}

function updateScene(poses /* Float64Array, 7 per frame: x,y,z,qx,qy,qz,qw */) {
  const framePos = [];
  for (let i = 0; i < 10; i++) {
    const o = i * 7;
    const p = new THREE.Vector3(poses[o], poses[o + 1], poses[o + 2]);
    framePos.push(p);
    jointMeshes[i].position.copy(p);
    jointMeshes[i].quaternion.set(poses[o + 3], poses[o + 4], poses[o + 5], poses[o + 6]);
  }
  for (let i = 0; i < 10; i++) {
    const parentPos = PARENT[i] < 0 ? _origin : framePos[PARENT[i]];
    placeLimb(limbMeshes[i], parentPos, framePos[i]);
  }
  ballProximal.position.copy(framePos[BALL_FRAME_PROXIMAL]);
  ballDistal.position.copy(framePos[BALL_FRAME_DISTAL]);
}

// --- Physics core ---
const DEFAULT_P = [100, 100, 100, 100];
const DEFAULT_D = [30, 30, 30, 30];
const DEFAULT_DEG = [45, -45, 90, -80];
const LIMITS = { p: [0, 400], d: [0, 100], deg: [-150, 150] };

// Demo trajectories: each maps elapsed sim time (seconds, resets with the sim on Reset) to a
// [deg0..deg3] target for the 4 PD joints. "manual" means the theta sliders drive the target.
function lerpKeyframes(t, keyframes, segDur) {
  const total = keyframes.length * segDur;
  const tt = ((t % total) + total) % total;
  const idx = Math.floor(tt / segDur);
  const a = keyframes[idx];
  const b = keyframes[(idx + 1) % keyframes.length];
  const f = (tt % segDur) / segDur;
  const smooth = f * f * (3 - 2 * f); // smoothstep, gentler than a linear step input
  return a.map((v, i) => v + (b[i] - v) * smooth);
}

const TRAJECTORIES = {
  manual: { label: "Manual", fn: null },
  reach: { label: "Reach & hold", fn: () => DEFAULT_DEG },
  wave: {
    label: "Wave",
    fn: (t) => [
      45 + 20 * Math.sin(t * 0.9),
      -45 + 25 * Math.sin(t * 0.7 + 1.0),
      90 + 18 * Math.sin(t * 1.1 + 2.0),
      -80 + 10 * Math.sin(t * 0.5),
    ],
  },
  sweep: {
    label: "Sweep",
    fn: (t) =>
      lerpKeyframes(
        t,
        [
          [0, 0, 0, 0],
          [45, -45, 90, -80],
          [-60, 30, -40, 60],
          [60, 60, -90, -40],
          [-30, -60, 60, 40],
        ],
        2.2
      ),
  },
  shake: {
    label: "Shake",
    fn: (t) => [45, -45 + 8 * Math.sin(t * 2.2), 90, -80 + 55 * Math.sin(t * 6.0)],
  },
};

let sim = null;
let running = true;
let activeTrajectory = "manual";

function buildControls() {
  const rowsEl = document.getElementById("joint-rows");
  rowsEl.innerHTML = "";
  const state = { p: [...DEFAULT_P], d: [...DEFAULT_D], deg: [...DEFAULT_DEG] };

  JOINT_NAMES.forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "joint-row";
    row.innerHTML = `
      <div class="joint-head"><span class="name">${name}</span><span class="val" id="val-${i}">${state.deg[i].toFixed(0)} deg</span></div>
      <div class="slider-line"><span class="tag">theta</span><input type="range" id="deg-${i}" min="${LIMITS.deg[0]}" max="${LIMITS.deg[1]}" step="1" value="${state.deg[i]}"><span class="num" id="num-deg-${i}">${state.deg[i]}</span></div>
      <div class="slider-line"><span class="tag">P</span><input type="range" id="p-${i}" min="${LIMITS.p[0]}" max="${LIMITS.p[1]}" step="1" value="${state.p[i]}"><span class="num" id="num-p-${i}">${state.p[i]}</span></div>
      <div class="slider-line"><span class="tag">D</span><input type="range" id="d-${i}" min="${LIMITS.d[0]}" max="${LIMITS.d[1]}" step="0.5" value="${state.d[i]}"><span class="num" id="num-d-${i}">${state.d[i]}</span></div>
    `;
    rowsEl.appendChild(row);
  });

  function applyGains(degOverride) {
    if (!sim) return;
    const deg = degOverride || state.deg;
    const qDesRad = deg.map((d) => (d * Math.PI) / 180);
    sim.set_gains(Float64Array.from(state.p), Float64Array.from(state.d), Float64Array.from(qDesRad));
    if (degOverride) {
      degOverride.forEach((d, i) => {
        document.getElementById(`val-${i}`).textContent = `${d.toFixed(0)} deg`;
        document.getElementById(`num-deg-${i}`).textContent = d.toFixed(0);
        document.getElementById(`deg-${i}`).value = d;
      });
    }
  }
  state.applyGains = applyGains;

  JOINT_NAMES.forEach((_, i) => {
    const degEl = document.getElementById(`deg-${i}`);
    const pEl = document.getElementById(`p-${i}`);
    const dEl = document.getElementById(`d-${i}`);
    degEl.addEventListener("input", () => {
      state.deg[i] = parseFloat(degEl.value);
      document.getElementById(`val-${i}`).textContent = `${state.deg[i].toFixed(0)} deg`;
      document.getElementById(`num-deg-${i}`).textContent = `${state.deg[i]}`;
      applyGains();
    });
    pEl.addEventListener("input", () => {
      state.p[i] = parseFloat(pEl.value);
      document.getElementById(`num-p-${i}`).textContent = state.p[i];
      applyGains();
    });
    dEl.addEventListener("input", () => {
      state.d[i] = parseFloat(dEl.value);
      document.getElementById(`num-d-${i}`).textContent = state.d[i];
      applyGains();
    });
  });

  return state;
}

const uiState = buildControls();

function setThetaSlidersDisabled(disabled) {
  JOINT_NAMES.forEach((_, i) => {
    document.getElementById(`deg-${i}`).disabled = disabled;
  });
}

function buildTrajectoryButtons() {
  const el = document.getElementById("traj-buttons");
  el.innerHTML = "";
  Object.entries(TRAJECTORIES).forEach(([key, traj]) => {
    const btn = document.createElement("button");
    btn.className = "action" + (key === activeTrajectory ? " primary" : "");
    btn.id = `traj-${key}`;
    btn.textContent = traj.label;
    btn.addEventListener("click", () => {
      activeTrajectory = key;
      document.querySelectorAll("#traj-buttons button").forEach((b) => b.classList.remove("primary"));
      btn.classList.add("primary");
      setThetaSlidersDisabled(key !== "manual");
      if (key === "manual") uiState.applyGains(); // resume slider-driven target immediately
    });
    el.appendChild(btn);
  });
  setThetaSlidersDisabled(activeTrajectory !== "manual");
}
buildTrajectoryButtons();

function freshSim() {
  const qDesRad = uiState.deg.map((d) => (d * Math.PI) / 180);
  return new Sim(Float64Array.from(uiState.p), Float64Array.from(uiState.d), Float64Array.from(qDesRad));
}

document.getElementById("btn-play").addEventListener("click", (e) => {
  running = !running;
  e.target.textContent = running ? "Pause" : "Play";
  e.target.classList.toggle("primary", running);
});
document.getElementById("btn-reset").addEventListener("click", () => {
  sim = freshSim();
  accumulator = 0;
});

const toggleBtn = document.getElementById("panel-toggle");
const panelEl = document.getElementById("panel");
toggleBtn.addEventListener("click", () => panelEl.classList.toggle("collapsed"));
if (window.matchMedia("(max-width: 640px)").matches) panelEl.classList.add("collapsed");

// --- Fixed-timestep physics loop driven by real elapsed time, rendered every frame. ---
let accumulator = 0;
let lastTime = performance.now();
const MAX_FRAME_DT = 0.1; // clamp to avoid a spiral-of-death after a tab is backgrounded
const MAX_STEPS_PER_FRAME = 32;
const hudT = document.getElementById("hud-t");

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - lastTime) / 1000, MAX_FRAME_DT);
  lastTime = now;
  if (sim && running) {
    const traj = TRAJECTORIES[activeTrajectory];
    if (traj && traj.fn) uiState.applyGains(traj.fn(sim.t()));

    accumulator += dt;
    const h = sim.h();
    let steps = 0;
    while (accumulator >= h && steps < MAX_STEPS_PER_FRAME) {
      sim.step();
      accumulator -= h;
      steps++;
    }
    updateScene(sim.frame_poses());
    hudT.textContent = sim.t().toFixed(2);
  }
  controls.update();
  renderer.render(scene, camera);
}

init()
  .then(() => {
    sim = freshSim();
    document.getElementById("hud-step").textContent = sim.h().toExponential(3);
    document.getElementById("loading").classList.add("hidden");
    requestAnimationFrame(tick);
  })
  .catch((err) => {
    document.getElementById("loading").textContent = "Failed to load WASM physics core: " + err;
  });
</script>
